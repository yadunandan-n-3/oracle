[project]
name = "oracle"
version = "0.1.0"
description = "AI-native Operating System for Cybersecurity"
requires-python = ">=3.10"
license = "MIT"

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "sqlalchemy>=2.0.0",
    "alembic>=1.13.0",
    "asyncpg>=0.30.0",
    "redis>=5.0.0",
    "neo4j>=5.20.0",
    "httpx>=0.27.0",
    "openai>=1.0.0",
    "langgraph>=0.1.0",
    "langchain>=0.3.0",
    "langchain-community>=0.3.0",
    "sentence-transformers>=3.0.0",
    "faiss-cpu>=1.8.0",
    "numpy>=1.26.0",
    "pandas>=2.0.0",
    "networkx>=3.3.0",
    "pyyaml>=6.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "python-multipart>=0.0.9",
    "celery>=5.4.0",
    "structlog>=24.0.0",
    "opentelemetry-api>=1.25.0",
    "opentelemetry-sdk>=1.25.0",
    "grpcio>=1.64.0",
    "protobuf>=5.27.0",
    "minio>=7.2.0",
    "qdrant-client>=1.10.0",
    "tenacity>=8.0.0",
    "cachetools>=5.0.0",
    "jinja2>=3.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.5.0",
    "black>=24.0.0",
    "mypy>=1.10.0",
    "pre-commit>=3.0.0",
    "httpx>=0.27.0",
    "faker>=25.0.0",
    "factory-boy>=3.3.0",
    "respx>=0.21.0",
    "asgi-lifespan>=2.1.0",
]
docs = [
    "mkdocs>=1.6.0",
    "mkdocs-material>=9.5.0",
    "pydocstyle>=6.3.0",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "ANN", "ARG", "B", "C4", "DTZ", "EM", "ERA", "G", "ISC", "NPY", "PD", "PGH", "PIE", "PL", "PT", "PTH", "PYI", "RET", "RSE", "RUF", "SIM", "SLF", "SLOT", "T20", "TCH", "TRY", "UP", "YTT"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
disallow_untyped_defs = true
disallow_any_unimported = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.setuptools.packages.find]
include = ["ai", "ai.*", "core", "core.*", "domain", "domain.*", "knowledge", "knowledge.*", "runtime", "runtime.*", "tools", "tools.*", "backend", "backend.*", "tests", "tests.*", "scripts", "scripts.*"]
